<!DOCTYPE html>
<html lang="th">
<head>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}



.box{width:1024px;margin:0 auto;}
header{background-image:url(images/header.jpg);
height:400px;
}
nav{background-color:pink;height:400px;flex:1}
article{background-color:yellow;height:400px;flex:4}
footer{background-color:green;height:100px;}
section{display:flex;}
a:link{
        color:green;
        text-decoration:none;
        background-color:Aqua;
        display:block;
        width:100px;
        padding:10px;
}
a:visited{
        color:red;
        text-decoration:none;
        background-color:transparent;
}
a:hover{
        color:pink;
        text-decoration:none;
        background-color:Cyan;
}
a:active{
        color:blue;
        text-decoration:none;
        background-color:transparent;
}

</style>
<meta charset="utf-8">
<title>work8 html layout</title>
</head>
<body>
<div class="box">
<header></header>
<section>
<nav>
<ul style="list-style-type:none">
<li><a href="#">มะม่วง</a></li>
<li><a href="#">มะนาว</a></li>
<li><a href="#">มะพร้าว</a></li>
<li><a href="#">ส้มโอ</a></li>
</ul>

</nav>
<article></article>
</section>
<footer></footer>
</body>
</html>
